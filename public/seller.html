<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="Área do vendedor da Star Colchões.">
  <title>Área do vendedor — Star Colchões</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/seller.js" defer></script>
</head>
<body class="account-page">
  <header class="account-header">
    <a class="brand" href="/" aria-label="Star Colchões, página inicial"><span class="brand-mark" aria-hidden="true">✳</span><span>star<span class="brand-light">colchões</span></span></a>
    <nav class="account-nav" aria-label="Área do vendedor"><a class="text-link" href="/account">Minha conta</a><button class="account-logout" id="seller-logout" type="button">Sair</button></nav>
  </header>
  <main class="dashboard-main seller-dashboard">
    <section class="dashboard-heading">
      <p class="eyebrow"><span class="eyebrow-line"></span> Área do vendedor</p>
      <h1>Olá, <span id="seller-name">vendedor</span>.</h1>
      <p class="account-intro">Seu acesso está protegido. O painel de vendas será disponibilizado aqui em uma próxima etapa.</p>
      <p class="dashboard-note">Para proteger sua conta, <a class="text-link" href="/account">troque sua senha</a> se ela foi fornecida pelo administrador.</p>
    </section>
  </main>
</body>
</html>
